name: Deploy UI-only changes fast

# A push to main that only changes the Portfolio Lab page deploys in a minute or two instead of
# 30-45, by reusing the latest built site from the refresh workflow instead of rebuilding data.
# No built site found = the job fails; it never falls back to deploying something old.
# Same "pages" concurrency group as refresh.yml, so it can never race the daily refresh.

on:
  push:
    branches: [main]
    paths:
      - "site/portfolio-lab/index.html"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest built site
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: refresh.yml
          branch: main
          workflow_conclusion: success
          name: pages-site
          path: _site
          if_no_artifact_found: fail

      # Swap in the page this push changed; everything else is the refresh's output, untouched.
      - name: Swap in the new page
        run: cp site/portfolio-lab/index.html _site/portfolio-lab/index.html

      # Keep the preview of the newest open pull request (or remove it if there is none).
      - name: Keep the open pull request's preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/add_preview.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: deploy-ui
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
