name: Holdings trial

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "ETFs to try"
        default: "XLK SPY QQQ SCHD IEUR AGG GLD VWO IWM ACWX MDY IEMG"

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Try the holdings pull
        run: python scripts/holdings.py ${{ inputs.tickers }}
      - name: Save the output to the holdings-trial branch (for previewing, not used by the site)
        run: |
          cd /tmp/inside_trial
          git init -q -b holdings-trial
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Holdings trial output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" holdings-trial
