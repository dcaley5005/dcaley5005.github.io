name: Holdings trial

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "ETFs to try"
        default: "XLK SPY QQQ SCHD IEUR AGG GLD VWO"

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Try the holdings pull
        run: python scripts/holdings.py ${{ inputs.tickers }}
