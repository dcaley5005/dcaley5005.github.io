name: SEC holdings trial

# One-off check of the SEC Form N-PORT bulk data: downloads one quarter, matches it to our ETF list,
# and saves a report plus a few sample ETFs to the nport-trial branch (not used by the site).
on:
  # runs on pushes to the working branch too, since a manual-only workflow can't be started until it's on main
  push:
    branches: [claude/new-session-1u2wve]
    paths: [scripts/nport.py, .github/workflows/nport-trial.yml]
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter to try, such as 2026q3, or latest"
        default: "latest"
      tickers:
        description: "ETFs to save as samples"
        default: "SPY QQQ XLK IWM SCHD IEUR VWO ARKK"
      contact:
        description: "Contact the SEC can see in the download request (name and email)"
        default: "Portfolio Lab daniel.caley1@gmail.com"

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Try the SEC holdings
        run: python scripts/nport.py --quarter "${{ inputs.quarter || 'latest' }}" --trial ${{ inputs.tickers || 'SPY QQQ XLK IWM SCHD IEUR VWO ARKK' }} --out /tmp/nport_trial/out 2>&1 | tee /tmp/nport_trial_log.txt
        env:
          SEC_USER_AGENT: ${{ inputs.contact || 'Portfolio Lab daniel.caley1@gmail.com' }}
      - name: Save the output to the nport-trial branch
        if: always()
        run: |
          mkdir -p /tmp/nport_trial/out && cp /tmp/nport_trial_log.txt /tmp/nport_trial/out/log.txt || true
          cd /tmp/nport_trial/out
          git init -q -b nport-trial
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "SEC holdings trial ${{ inputs.quarter || 'latest' }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" nport-trial
