name: Refresh prices and deploy

on:
  schedule:
    # GitHub starts scheduled runs 3 to 7 hours late (every day since Oct 1), so the main run
    # is set right after the market closes: 23:17 UTC = 4:17pm Pacific (3:17pm in winter),
    # Monday to Friday, about 2 hours after the close. Even a late start lands by evening.
    - cron: "17 23 * * 1-5"
    # Backup the next morning, which also picks up any overnight corrections to the close.
    # Runs queue in the "pages" group below, so the two never overlap.
    - cron: "17 12 * * 2-6"
  workflow_dispatch:
    inputs:
      rebuild_universe:
        description: "Re-rank the ETF list now"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      # A push touching ONLY the page is handled by deploy-ui.yml;
      # the negative pattern must come after the positive match.
      - "!site/portfolio-lab/index.html"

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # holding prices from earlier runs, so each run only downloads part of them
      - uses: actions/cache@v4
        with:
          path: .cache
          key: holding-prices-${{ github.run_id }}
          restore-keys: holding-prices-

      - name: Build data and site
        run: python scripts/build_data.py
        env:
          REBUILD_UNIVERSE: ${{ inputs.rebuild_universe }}
          # A push that only changes the site reuses the saved fund details and holdings instead of
          # refreshing them from Yahoo, so it deploys in minutes; scheduled and manual runs refresh as usual.
          FUND_INFO_MINUTES: ${{ github.event_name == 'push' && '0' || '30' }}
          HOLDINGS_MINUTES: ${{ github.event_name == 'push' && '0' || '15' }}
          STOCK_INFO_MINUTES: ${{ github.event_name == 'push' && '0' || '10' }}

      - name: Save the ETF list, fund details and holdings if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe.json
          [ -f data/fund_info.json ] && git add data/fund_info.json
          [ -f data/holdings.json ] && git add data/holdings.json
          [ -f data/stocks.json ] && git add data/stocks.json
          # main may have moved while this ran (a site push or the SEC update), so catch up before pushing
          git diff --cached --quiet || (git commit -m "Update ETF list and fund details" && git pull --rebase origin main && git push)

      - name: Save the built site for UI-only deploys
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: _site
          retention-days: 2

      # Keep the preview of the newest open pull request (or remove it if there is none).
      # Added after the pages-site upload above, so the saved built site never carries a preview.
      - name: Keep the open pull request's preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/add_preview.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
