<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Caley</title>
<meta name="description" content="Daniel Caley">
<style>
  :root{--bg:#fbfaf8;--fg:#1d1c1a;--mut:#6b6862;--line:#e4e1dc;--card:#fff;--acc:#2f6fdb}
  @media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eceae6;--mut:#a09d97;--line:#2e2d2a;--card:#1e1e1b;--acc:#7aa7f2}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
  main{max-width:640px;margin:0 auto;padding:72px 16px}
  h1{font-size:32px;letter-spacing:-.02em;margin:0 0 6px}
  p{color:var(--mut);margin:0 0 36px}
  a.card{display:block;padding:20px 22px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;text-decoration:none;transition:border-color .15s}
  a.card:hover,a.card:focus-visible{border-color:var(--acc)}
  a.card strong{display:block;font-size:18px;margin-bottom:4px}
  a.card span{color:var(--mut);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Daniel Caley</h1>
  <p>Projects and experiments.</p>
  <a class="card" href="/portfolio-lab/"><strong>Portfolio Lab →</strong><span>Build ETF portfolios, compare them over any period, and follow a 12% Solution style momentum strategy. Prices refresh every weekday morning.</span></a>
</main>
</body>
</html>
