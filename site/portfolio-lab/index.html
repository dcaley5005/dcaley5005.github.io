<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Build ETF portfolios, compare returns and risk, and follow a 12% Solution style momentum strategy.">
<title>Portfolio Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F0E8;--panel:#FFFDF8;--panel2:#F6F3EC;--pill:#ECE8DE;--line:#DDD6C8;--line2:#EEE9DE;
  --ink:#1C1B18;--ink2:#3D3A34;--muted:#5E5A52;--faint:#8A8478;--input:#FFFFFF;--inputLine:#CFC7B6;
  --accent:#1D6B4C;--accentBg:#E6F0E9;--pos:#1D6B4C;--neg:#A8401C;--posBar:#3F9A70;--negBar:#C9724C;
  --btn:#1C1B18;--btnInk:#FFFDF8;--warnBg:#F4DDB0;--warnFg:#5A3A08;--grid:#E8E2D5;--lockBg:#ECE8DE;
  --p1:#2a78d6;--p2:#eb6834;--p3:#1baf7a;--p4:#eda100;--p5:#e87ba4;--p6:#4a3aa7;--tw:#1C1B18;--spy:#8A8478;
  --focus:#2a78d6;--segOn:#1C1B18;--segOnFg:#FFFDF8;--segOnLine:#1C1B18;--tyEq:#2E8A63;--tyEqBg:#E3EFE7;--tyEqFg:#1D5A40;--tyBd:#4A6FA5;--tyBdBg:#E6EAF3;--tyBdFg:#2F4F80;--tyCa:#C98A12;--tyCaBg:#FBF0D6;--tyCaFg:#6B4608;--tyCaLine:#E2B654;--tyOt:#8A5CB8;--tyOtBg:#EFE7F6;--tyOtFg:#5A3D78;--shadow:0 10px 30px rgba(28,27,24,.16);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412;--panel:#1D1C19;--panel2:#262521;--pill:#2A2925;--line:#35332E;--line2:#2A2925;
  --ink:#EDE8DC;--ink2:#CFC9BB;--muted:#A39D90;--faint:#7E786C;--input:#121210;--inputLine:#45423B;
  --accent:#6CC39A;--accentBg:#1C2E25;--pos:#6CC39A;--neg:#EE9A74;--posBar:#4FAE82;--negBar:#D07A55;
  --btn:#EDE8DC;--btnInk:#141412;--warnBg:#2E2618;--warnFg:#D9AE6A;--grid:#2A2925;--lockBg:#2A2925;
  --p1:#3987e5;--p2:#d95926;--p3:#199e70;--p4:#c98500;--p5:#d55181;--p6:#9085e9;--tw:#B8B0A0;--spy:#8F897D;
  --focus:#3987e5;--segOn:#3A3833;--segOnFg:#F3F0E8;--segOnLine:#8A8478;--tyEq:#4FAE82;--tyEqBg:#1C2E25;--tyEqFg:#8FD3B0;--tyBd:#7E9FD6;--tyBdBg:#1F2838;--tyBdFg:#A9BEE6;--tyCa:#E0A93A;--tyCaBg:#3A2E14;--tyCaFg:#F4C27A;--tyCaLine:#8A6A24;--tyOt:#B08BDA;--tyOtBg:#2C2238;--tyOtFg:#CDB2EA;--shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141412;--panel:#1D1C19;--panel2:#262521;--pill:#2A2925;--line:#35332E;--line2:#2A2925;
  --ink:#EDE8DC;--ink2:#CFC9BB;--muted:#A39D90;--faint:#7E786C;--input:#121210;--inputLine:#45423B;
  --accent:#6CC39A;--accentBg:#1C2E25;--pos:#6CC39A;--neg:#EE9A74;--posBar:#4FAE82;--negBar:#D07A55;
  --btn:#EDE8DC;--btnInk:#141412;--warnBg:#2E2618;--warnFg:#D9AE6A;--grid:#2A2925;--lockBg:#2A2925;
  --p1:#3987e5;--p2:#d95926;--p3:#199e70;--p4:#c98500;--p5:#d55181;--p6:#9085e9;--tw:#B8B0A0;--spy:#8F897D;
  --focus:#3987e5;--segOn:#3A3833;--segOnFg:#F3F0E8;--segOnLine:#8A8478;--tyEq:#4FAE82;--tyEqBg:#1C2E25;--tyEqFg:#8FD3B0;--tyBd:#7E9FD6;--tyBdBg:#1F2838;--tyBdFg:#A9BEE6;--tyCa:#E0A93A;--tyCaBg:#3A2E14;--tyCaFg:#F4C27A;--tyCaLine:#8A6A24;--tyOt:#B08BDA;--tyOtBg:#2C2238;--tyOtFg:#CDB2EA;--shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}
.wrap{max-width:1760px;margin:0 auto;padding-inline:clamp(16px,3vw,48px);padding-block:32px 56px;display:flex;flex-direction:column;gap:24px}
h1,h2{font-family:Newsreader,Georgia,"Times New Roman",serif;font-weight:600;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,4vw,44px);letter-spacing:-.01em;line-height:1.05}
h2{font-size:26px;line-height:1.15}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow,.cap{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sub{font-size:13px;color:var(--muted);line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.controls{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl .cap{display:flex;align-items:center;gap:4px}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--pill);border-radius:10px}
.seg button{border:0;background:transparent;border-radius:7px;min-height:36px;padding:0 12px;font-size:14px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btnInk)}
.asof{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--muted)}
.asof strong{color:var(--ink);font-weight:500;font-family:"IBM Plex Mono",monospace;font-size:14px}
.btn{height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:transparent;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btnInk)}
.btn.sm{height:40px;padding:0 14px;font-size:14px;border-color:var(--inputLine);background:var(--panel2)}
.btn svg{width:18px;height:18px}

.banner{padding:12px 16px;border-radius:10px;background:var(--warnBg);color:var(--warnFg);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.phead>div:first-child{display:flex;flex-direction:column;gap:2px}

/* info popover */
.info{width:22px;height:22px;border:0;padding:0;border-radius:50%;background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:middle}
.info:hover,.info[aria-expanded="true"]{color:var(--ink);background:var(--pill)}
.info svg{width:15px;height:15px}
.pop{position:fixed;z-index:90;width:min(340px,calc(100vw - 32px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;font-size:14px;line-height:1.5;text-transform:none;letter-spacing:0;font-weight:400;text-align:left;white-space:normal}
.pop h3{margin:0 0 6px;font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:600}
.pop .lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:8px;display:block}
.pop p{margin:2px 0 0}

/* portfolio list */
.lrow{display:grid;grid-template-columns:30px minmax(210px,270px) minmax(0,1fr) 190px 76px 124px 78px 64px 100px;column-gap:14px;align-items:center}
.lhead{padding:8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.lhead>*{display:flex;align-items:center;gap:2px}
.lhead .r{justify-content:flex-end}.lhead .c{justify-content:center}
.item{border-bottom:1px solid var(--line2)}
.item.open{background:var(--panel2);border-radius:10px;border-bottom-color:transparent;margin-block:4px}
.item .lrow{min-height:56px;font-size:15px}
.rank{padding-left:6px;color:var(--muted)}
.namebtn{display:flex;align-items:center;gap:10px;min-width:0;min-height:44px;padding:0;border:0;background:none;text-align:left;font-size:15px}
.namebtn .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:10px;background:var(--lockBg);color:var(--ink2)}
.holds{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:14px;width:190px}
.bar .z{position:absolute;left:95px;top:-6px;width:1px;height:26px;background:var(--line)}
.bar .f{position:absolute;top:0;height:14px;border-radius:2px}
.r{text-align:right}
.edit{justify-self:end;height:36px;padding:0 10px 0 12px;border-radius:8px;border:1px solid var(--inputLine);background:var(--panel2);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.item.open .edit{background:var(--btn);border-color:var(--btn);color:var(--btnInk)}
.edit svg{width:14px;height:14px;transition:transform .15s}
.item.open .edit svg{transform:rotate(180deg)}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding:4px 12px 20px 44px}
.erow{display:grid;grid-template-columns:92px minmax(0,1fr) 96px 92px 36px;column-gap:12px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line2)}
.erow.h{border:0;padding-top:8px}
.erow .r{justify-content:flex-end}
.field{height:42px;border:1px solid var(--inputLine);border-radius:8px;background:var(--input);padding:0 12px;font-size:15px;min-width:0}
.wbox{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:13px;color:var(--muted)}
.tkin{width:100%;height:38px;padding:0 8px;font-family:"IBM Plex Mono",monospace;font-weight:500;text-transform:uppercase}
.wbox .field{width:64px;height:38px;padding:0 8px;text-align:right;font-family:"IBM Plex Mono",monospace}
.x{width:36px;height:38px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:8px}
.x:hover{background:var(--pill)}
.addetf{display:flex;gap:8px;max-width:520px;padding-top:6px}
.addetf .field{flex:1;text-transform:uppercase;font-family:"IBM Plex Mono",monospace;font-size:14px}
.plrow{user-select:none;-webkit-user-select:none}
.total{display:flex;justify-content:space-between;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500}
.badge.warnb{background:var(--warnBg);color:var(--warnFg);letter-spacing:0}
.sub.warnt{color:var(--neg)}
.scalebox{display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);padding:2px 2px 4px}
.total.ok{background:var(--accentBg);color:var(--accent)}.total.bad{background:var(--warnBg);color:var(--warnFg)}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{padding:10px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line2);display:flex;flex-direction:column;gap:2px}
.mini .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:2px}
.mini .v{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.del{color:var(--neg);border-color:var(--inputLine);background:transparent}
.btn.ghost{border-color:var(--inputLine);background:transparent}
.twinfo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;padding:4px 12px 20px 44px;align-items:start}
.sigcols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.sigcols .sig{grid-template-columns:96px 58px 76px auto;column-gap:8px}
.sigcols .sig>span{white-space:nowrap}
.sigcols>div:last-child .sig{grid-template-columns:96px 58px 0 auto}
.sigcols .sig.cap>span:first-child{white-space:nowrap}
.sigcols .pick{font-size:10px;padding:1px 6px}
.twlog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
.sig{display:grid;grid-template-columns:70px 80px 90px 1fr;column-gap:12px;align-items:center;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line2)}
.pick{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--accentBg);color:var(--accent)}
.log{display:grid;grid-template-columns:minmax(96px,1.3fr) 1fr 1fr;column-gap:12px;font-size:14px;padding:3px 0;border-bottom:1px solid var(--line2)}
.addp{margin-top:8px;height:52px;border-radius:10px;border:2px dashed var(--inputLine);background:transparent;color:var(--ink2);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.addp:hover:not(:disabled){border-color:var(--ink2)}

/* chart */
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="false"]{background:transparent;opacity:.55}
.chartbox{position:relative;touch-action:pan-y}
.chartbox svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;top:6px;pointer-events:none;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:5px;z-index:5}
.tip .d{font-weight:600;margin-bottom:2px}
.tip .tr{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.tip .tr span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* table */
.tablewrap{overflow-x:auto;max-width:100%;min-width:0;position:relative}
.bstep,#bBody{min-width:0}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:900px}
th{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:500;vertical-align:bottom}
th .hw{display:inline-flex;align-items:center;gap:0}
th.r .hw{justify-content:flex-end}
th .sort{border:0;background:none;padding:6px 2px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--muted)}
th .sort[aria-pressed="true"]{color:var(--ink)}
td{padding:10px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
td.best{font-weight:700}
.pn{display:flex;align-items:center;gap:8px;font-weight:600}

/* builder */
.builder{padding:0;gap:0;overflow:hidden}
.bhead{display:flex;align-items:center;gap:14px;width:100%;padding:20px 28px;border:0;background:transparent;text-align:left;color:var(--ink)}
.bhead:hover{background:var(--panel2)}
.bicon{width:36px;height:36px;border-radius:10px;background:var(--btn);color:var(--btnInk);display:flex;align-items:center;justify-content:center;flex:none}
.bicon svg,.bchev svg{width:18px;height:18px}
.bchev{width:36px;height:36px;border-radius:8px;border:1px solid var(--inputLine);display:flex;align-items:center;justify-content:center;flex:none;transition:transform .15s}
.builder.open .bchev{transform:rotate(180deg)}
.builder.open .bheadwrap{border-bottom:1px solid var(--line)}
#bBody{padding:12px 24px 14px;display:flex;flex-direction:column;gap:10px}
.bstep{display:flex;flex-direction:column;gap:10px}
.bpick{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.echips{display:flex;flex-wrap:wrap;gap:8px}
.echip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:18px;background:var(--panel2);height:36px}
.echip.off{opacity:.5;background:transparent}
.echip .et{border:0;background:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 4px 0 12px;font-size:14px;font-weight:500}
.echip .ex{border:0;background:none;width:32px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:0 18px 18px 0}
.echip .ex:hover{color:var(--neg)}
.btable{min-width:860px}
.btable th.hl,.btable td.hl{background:var(--panel2)}
.btable .wbox .field{width:72px}
.bsaverow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.bsaverow .total{min-width:220px;align-self:flex-end;height:42px;align-items:center}
.bsaverow .acts{align-self:flex-end}
.bsave{padding:14px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
/* portfolios table */
.ptable{min-width:1040px}
.ptable th .sort{white-space:normal;text-align:right;line-height:1.3}
.ptable th{white-space:normal}
.momwrap .v{min-width:56px;text-align:right}
.btn.primary:disabled{background:var(--pill);border-color:var(--line);color:var(--muted);opacity:1}
.ptable td{padding:8px 6px;vertical-align:middle}
.ptable .nm{white-space:nowrap}
.holdcell{font-size:13px;color:var(--ink2);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.momwrap{display:inline-flex;align-items:center;gap:10px;justify-content:flex-end}
.actcell{text-align:right}
.actwrap{display:inline-flex;gap:6px;align-items:center;justify-content:flex-end}
.ptable .edit{justify-self:auto}
.delbtn{height:36px;min-width:36px;padding:0 8px;border-radius:8px;border:1px solid var(--inputLine);background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.delbtn:hover{color:var(--neg);border-color:var(--neg)}
.dupbtn{gap:5px;padding:0 8px}@media (max-width:1879px){.dupbtn svg{display:none}.dupbtn{padding:0 8px;font-size:12px}}.dupbtn:hover{color:var(--ink);border-color:var(--muted)}.dupbtn:disabled{opacity:.45;cursor:not-allowed}
.delbtn.armed{background:var(--neg);border-color:var(--neg);color:var(--panel)}
tr.editing td{background:var(--accentBg)}
tr.twrow td{background:var(--panel2);padding:0}
tr.twrow .twinfo{padding:16px 12px 20px 12px}
@media (max-width:640px){.bhead{padding:16px}#bBody{padding:16px}}

tr.editrow td{background:var(--panel2);padding:0;white-space:normal}
tr.twrow td{white-space:normal}
.btn.sm.primary{background:var(--btn);border-color:var(--btn);color:var(--btnInk)}
.btn.sm.primary:disabled{background:var(--pill);border-color:var(--line);color:var(--muted);opacity:1}
.inlined{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding:14px 16px 18px}
.inlined .erow{grid-template-columns:92px minmax(0,1fr) 96px 80px 36px}
@media (max-width:900px){.inlined{grid-template-columns:minmax(0,1fr)}}

.bgrid{display:block}
.btable .tkcell{display:flex;align-items:center;gap:4px}
.btable .tkin{width:88px;height:28px;font-size:14px}
.btable tbody td,.btable tfoot td{padding-top:2px;padding-bottom:2px}
.btable .bdel{height:28px!important}
.btable .rsw{height:28px!important}
.btable tbody td.num,.btable tfoot td.num{font-size:14px}
.btable .rsw{height:30px}
.btable .x{height:30px;width:30px}
.btable thead th{padding-top:4px;padding-bottom:6px;vertical-align:middle}

.btable td.wcell,.btable th.wcell{width:1%;white-space:nowrap;padding-left:14px}
.btable th:first-child,.btable td:first-child{width:1%;white-space:nowrap}
.btable .wbox .field{width:60px;height:28px;font-size:14px}
.btable td.xcell{width:44px;text-align:right}
.btable th.retcol{white-space:nowrap}
.btable .momwrap svg{width:60px}
.btable .momwrap{gap:6px}
.btable .bdel{height:30px;min-width:32px}

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MAXP = 15, MAXETF = 15;
const PRESETS=[['1M',1],['3M',3],['6M',6],['YTD',0],['1Y',12],['3Y',36],['5Y',60],['10Y',120]];

/* ---------- info copy ---------- */
const INFO = {
  period:{t:()=>'Time period',sec:()=>[['Presets','1M to 10Y go back that many months or years from the latest price. YTD starts at the last close of the prior year.'],['Last … days','Type any number of calendar days, like 30 or 90, and press Enter. It unselects the preset buttons; clicking a preset clears the box.'],['What it changes','The chart, the list beside it and the return column in the table all use this period. The 1Y, 3Y and 5Y columns stay fixed. In Build a portfolio, Sharpe and max drawdown also follow this period; worst year always looks back 10 years.']]},
  bret:{t:()=>selLabel(S.b.sel,'adj')+' return',w:()=>`The total gain or loss over the period picked above the chart (${selLabel(S.b.sel,'span')}), from ${dayLabel(selStart(S.b.sel))} to ${dayLabel(D.last)}.`,h:()=>'Each ETF’s price change over the period, dividends included. The Portfolio total row uses your percentages, bought at the start and held without rebalancing.',y:()=>'The little line shows the path over the same period, so you can tell a steady climb from a late spike or a fade from a high.'},
  ret:{t:L=>selLabel(L,'adj')+' return',w:L=>`The total gain or loss over the period picked above (${selLabel(L,'span')}), from ${dayLabel(selStart(L))} to ${dayLabel(D.last)}.`,h:()=>'Each ETF’s price change over the period (dividends included), weighted by your percentages and held without rebalancing. For the 12% Solution it is the strategy’s actual result.',y:()=>'The little line shows the path over the same period, so you can tell a steady climb from a late spike or a fade from a high.'},
  y10:{t:()=>'Annual return (10 years)',w:()=>'The average yearly growth if you had bought the portfolio at your percentages 10 years ago and held it.',h:()=>'(Ending value ÷ starting value) raised to the power of 1/10, minus 1. This is often called CAGR, the compound annual growth rate.',y:()=>'It is the simplest "how much did it make" number, and small differences compound. $10,000 growing 10% a year becomes about $25,900 in 10 years; at 12% it becomes about $31,100.'},
  y1:{t:()=>'1-year return',w:()=>'The total gain or loss if you had bought 12 months ago.',h:()=>'Value today ÷ value one year ago, minus 1.',y:()=>'Shows whether the long-term record is holding up lately.'},
  y3:{t:()=>'3-year return (per year)',w:()=>'The average yearly return if you had bought 3 years ago.',h:()=>'Same compound-growth math as the 10-year number, over 3 years.',y:()=>'A middle view: long enough to smooth out a single bad quarter, short enough to reflect recent markets.'},
  y5:{t:()=>'5-year return (per year)',w:()=>'The average yearly return if you had bought 5 years ago.',h:()=>'Same compound-growth math as the 10-year number, over 5 years.',y:()=>'Covers at least one full up-and-down cycle in most periods, so it is harder for luck to carry the number.'},
  sharpe:{t:()=>'Sharpe ratio',w:()=>'Higher is better. How much return you got for the risk you took. Think of it as a "smoothness score" for your returns.',h:()=>'Take the average return minus what SHY (near-cash) earned, then divide by how much returns bounced around, scaled to a year. In Build a portfolio it uses daily prices over the period you pick above the chart. In Your portfolios it uses month-end prices over up to 10 years.',y:()=>'Two portfolios can both make 10% a year: one with gentle ups and downs, the other on a roller coaster. The higher Sharpe is the smoother ride for the same payoff. Rough guide: under 0.5 is weak, 0.5 to 1 is good, above 1 is very good.'},
  er:{t:()=>'Expense ratio (fee)',w:()=>'Lower is better. The yearly fee the fund charges, taken out of its returns automatically.',h:()=>'From Yahoo Finance, refreshed weekly. The total row is the fee of your mix, weighted by your percentages.',y:()=>'On $10,000, a 0.10% fee costs $10 a year and a 0.75% fee costs $75. Small differences add up over decades.'},
  dd:{t:()=>'Max drawdown',w:()=>'Closer to 0% is better. The worst drop from a high point to a low point before it recovered. In Build a portfolio it covers the period you pick above the chart; in Your portfolios, the last 10 years.',h:()=>'Track the highest daily close reached so far; the biggest percentage fall below that high is the max drawdown.',y:()=>'It answers "how much pain would I have had to sit through?" A −30% drawdown means $100,000 fell to $70,000 at some point. This is the number that makes people panic-sell at the bottom.'},
  vol:{t:()=>'Volatility',w:()=>'Lower is calmer. How much the portfolio’s value swings around from month to month.',h:()=>'The standard deviation of monthly returns, scaled up to a year.',y:()=>'Higher volatility means bigger swings in both directions. In about two out of three years, the return lands within one volatility of the average. Lower is calmer.'},
  worst:{t:()=>'Worst calendar year',w:()=>'Closer to 0% (or positive) is better. The worst January-to-December return in the last 10 years, and which year it was.',h:()=>'The return from each December 31 to the next; the lowest one is shown.',y:()=>'A gut check: could you have held on through that year without selling?'},
  _views:{t:()=>'Cumulative % and Momentum',sec:L=>[['Cumulative %','The total return from the start of the period you pick (3M to 10Y) to today. Every line starts at 0%, so the highest line made the most.'],['Momentum',`At each month-end, the return over the previous ${L} months. Pick 3, 6 or 12 months right next to Momentum. The period buttons only set how far back the chart goes.`],['Which to use','Cumulative % shows who came out ahead. Momentum shows who is gaining or losing strength right now, which is what the 12% Solution trades on (it uses 3 months).']]},
  returns:{t:()=>'Returns',sec:()=>[['What they show','How much it gained or lost if you had bought at the start of each period and held to today, dividends included.'],['How to read them','3M, 6M and 1Y are total returns. 3Y, 5Y and 10Y are average returns per year, so a long period compares fairly with a short one.'],['Why it matters','Compare recent strength (3M to 1Y) with the long-term record (3Y and up). A fund that is strong on both is more convincing than one strong on only one.'],['Newer ETFs','If an ETF started trading after the others in a portfolio, its share is spread across the others until its first day. On that day the portfolio is reset to your percentages, so the total still covers the full history.']]},
  holds:{t:()=>'Holds',w:()=>'The ETFs in each portfolio and their target percentages.',h:()=>'For the 12% Solution, what it holds this month based on the last month-end.',y:()=>'Open a portfolio with Edit to change its ETFs or percentages.'}
};

/* ---------- storage ---------- */
function load(k,d){try{const v=localStorage.getItem('pl:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem('pl:'+k,JSON.stringify(v))}catch(e){}}

/* ---------- CSV ---------- */
function parseCSV(text){const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch==='\t'||ch===';'){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()!==''))}
function parseDate(s){s=String(s).trim();let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return{y:+m[1],mo:+m[2],d:+m[3]};
  if((m=s.match(/^(\d{4})[-\/](\d{1,2})$/)))return{y:+m[1],mo:+m[2],d:null};
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){let y=+m[3];if(y<100)y+=y<70?2000:1900;return{y,mo:+m[1],d:+m[2]}}
  const t=Date.parse(s);if(!isNaN(t)){const d=new Date(t);return{y:d.getFullYear(),mo:d.getMonth()+1,d:d.getDate()}}return null}
function toNum(s){s=String(s??'').replace(/[$,\s"]/g,'');if(!s||/^(null|nan|-|n\/a)$/i.test(s))return null;const v=Number(s);return isFinite(v)&&v>0?v:null}
function cleanTicker(h){const m=String(h).toUpperCase().match(/[A-Z][A-Z0-9.]{0,7}/);return m?m[0].replace(/\.$/,''):null}
const ymKey=(y,mo)=>y+'-'+String(mo).padStart(2,'0');
const dKey=(y,mo,d)=>ymKey(y,mo)+'-'+String(d).padStart(2,'0');
function readFile(text,filename){
  const rows=parseCSV(text);if(rows.length<2)throw new Error(filename+': the file is empty or only has a header row.');
  let hi=rows.findIndex(r=>r.some(c=>/^\s*(date|month|time|period)/i.test(c)));if(hi<0)hi=0;
  const head=rows[hi].map(c=>c.trim());let di=head.findIndex(c=>/^(date|month|time|period)/i.test(c));
  if(di<0){if(parseDate(rows[hi+1]?.[0]||''))di=0;else throw new Error(filename+": couldn't find a date column. Name the first column Date.")}
  const symI=head.findIndex(c=>/^(symbol|ticker)$/i.test(c)),adjI=head.findIndex(c=>/^adj\.?\s*close/i.test(c)),closeI=head.findIndex(c=>/^close\*?$/i.test(c)||/^(price|last)$/i.test(c));
  const pick=adjI>=0?adjI:closeI;const raw={};
  const put=(t,ds,rv)=>{const dt=parseDate(ds),v=toNum(rv);if(!t||!dt||v==null)return;(raw[t]=raw[t]||[]).push({...dt,v})};
  const body=rows.slice(hi+1);
  if(symI>=0&&pick>=0)body.forEach(r=>put(cleanTicker(r[symI]),r[di],r[pick]));

function renderXM(){const b=$('xmBody');renderXMFoot();
  if(XM.err){b.innerHTML=`<div class="xnote"><b>Nothing to show</b><span>${esc(XM.err)}</span></div>`;return}
  const d=XM.d;if(!d){b.innerHTML='<div class="xskel" style="height:70px"></div><div class="xskel" style="height:300px"></div><div class="xskel" style="height:260px"></div>';return}
  const s=d.self,t=s.t;$('xmSub').textContent=(s.n||NAMES[t]||'')+' · alternatives are picked on the last 3 years ('+dayFmt(d.from)+' to '+dayFmt(d.to)+')';
  const gl=XR.map(([l,k,i])=>`<button type="button" class="xg ${xcls(s.r[i])}${XM.rng===k?' sel':''}" data-xrng="${k}" aria-pressed="${XM.rng===k}" title="Show ${XRWORD[k]} on the line charts"><span>${l}</span><b>${xp(s.r[i])}</b></button>`).join('')+`<div class="xg" id="xgSh"><span>Sharpe (${XM.rng})</span><b>${xRisk(s).sh.toFixed(2)}</b></div><div class="xg n" id="xgDd"><span>Max DD (${XM.rng})</span><b>${xu(xRisk(s).dd)}</b></div><div class="xg"><span>Fee</span><b>${fmtER(s.er)}</b></div>`;
  const same=d.same.length?`<div class="xcards">${d.same.map(c=>xCard(c,s,'same')).join('')}</div>`
    :`<div class="xahead"><div class="top"><span class="ck"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l4.8 4.8L19.5 7"/></svg></span><div><b style="font-size:16px">Nothing similar beat ${esc(t)} without much more risk</b><div class="mut" style="font-size:14px">No ETF that moves 85%+ in step with ${esc(t)} earned at least 1 point a year more without over 25% more volatility.${(d.closest||[]).length?' Here are the closest ones for reference.':''}</div></div></div>${(d.closest||[]).length?`<div class="xtblw"><table class="xtbl"><thead><tr><th>ETF</th><th>1M</th><th>3M</th><th>6M</th><th>YTD</th><th>1Y</th><th>3Y</th><th>Sharpe</th><th>Max DD</th><th>Fee</th><th></th></tr></thead><tbody>${d.closest.map(c=>`<tr data-xc="${esc(c.t)}"><td><b>${esc(c.t)}</b> <span style="color:var(--xs);font-size:12px">tracks ${Math.round(c.c*100)}%</span></td>${c.r.map(v=>`<td class="${v==null?'mut':v>=0?'pos':'neg'}">${xp(v)}</td>`).join('')}<td>${c.sh.toFixed(2)}</td><td class="neg">${xu(c.dd)}</td><td>${fmtER(c.er)}</td><td><button type="button" class="xadd" style="height:32px;padding:0 10px;font-size:12px" data-xadd="${esc(c.t)}"></button></td></tr>`).join('')}</tbody></table></div>`:''}</div>`;
  const dv=d.div.length?`<div class="xcards">${d.div.map(c=>xCard(c,s,'div')).join('')}${d.div.length<3?`<div class="xnote"><b>Only ${d.div.length} found</b><span>Nothing else had 15%+ less volatility than ${esc(t)} while staying within 2 points a year of its return.</span></div>`:''}</div>`
    :`<div class="xnote"><b>No less risky fund kept up with ${esc(t)}</b><span>No ETF had 15%+ less volatility while staying within 2 points a year of its 3-year return.</span></div>`;
  const mo=!d.mom?'':`<section class="xsec"><h3>Momentum <small>Moves like ${esc(t)} and is ahead of it over the last 3 months, without much more risk</small></h3>${d.mom.length?`<div class="xcards">${d.mom.map(c=>xCard(c,s,'mom')).join('')}${d.mom.length<3?`<div class="xnote"><b>Only ${d.mom.length} ahead lately</b><span>${esc(t)} is ${xp(s.m3)} over the last 3 months, so few similar funds have kept ahead of it.</span></div>`:''}</div>`:`<div class="xnote"><b>Nothing similar is ahead of ${esc(t)} lately</b><span>No fund that moves like ${esc(t)} beat it by 2+ points over the last 3 months without much more risk. ${esc(t)} itself is ${xp(s.m3)}.</span></div>`}</section>`;
  b.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px"><div class="xcap">${esc(t)} at a glance <span class="xcap2">· click a period to change the line charts</span></div><div class="xglance">${gl}</div></div>
    <div class="xtop">${xChart(d)}<div class="xlegend"><div class="li"><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="var(--ink)"/></svg><span>${esc(t)}, the ETF you clicked</span></div><div class="li" data-xk="same"><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="var(--xs)"/></svg><span>Higher return: moves 85%+ in step with ${esc(t)}, earned more</span></div><div class="li" data-xk="div"><svg width="14" height="14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" fill="var(--xd)"/></svg><span>Less risk: 15%+ less volatility, about the same return</span></div>${d.mom?`<div class="li" data-xk="mom"><svg width="14" height="14" aria-hidden="true"><path d="M7 1L13 12H1Z" fill="var(--xm)"/></svg><span>Momentum: ahead of ${esc(t)} over the last 3 months, plotted on its 3-year numbers</span></div>`:''}
    <div class="how">Picked from ${d.pool.toLocaleString()} ETFs. Hover a dot or a card to compare.</div></div></div>
    <section class="xsec"><h3>Higher return, similar risk <small>Moves like ${esc(t)} and earned more, without much more risk</small></h3>${same}</section>
    <section class="xsec"><h3>Less risk, similar return <small>Less risk than ${esc(t)} with about the same return</small></h3>${dv}</section>${mo}
    <p class="xdisc">Past performance doesn't guarantee future results. These are ideas to research, not advice.</p>`;
  renderXMButtons()}
function xHowHTML(){const t=XM.t||'this ETF',d=XM.d;const st=(k,p)=>`<div class="xstep"><span class="k">${k}</span><p>${p}</p></div>`;
  return st('The pool',`${d?d.pool.toLocaleString():'About 1,800'} ETFs with at least 3 years of prices and $50M in assets. Left out: buffer, option-income and covered-call funds, trading funds, hedged, tactical and long/short strategies, ETNs, and anything charging more than 1% a year.`)
   +st('Higher return, similar risk',`Moves at least 85% in step with ${t}, earned at least 1 point a year more over 3 years, and has no more than 25% more volatility. Best Sharpe first.`)
   +st('Less risk, similar return',`At least 15% less volatility than ${t} over 3 years, with a yearly return no more than 2 points below it. Best Sharpe first.`)
   +st('Momentum',`Moves at least 85% in step with ${t} and is ahead of it by 2+ points over the last 3 months, using the average of the last 10 days so one week can't flip it. No more than 25% more volatility, and a 3-year return within 3 points of ${t}. Strongest 3 months first.`)
   +`<p class="xstepn">Return and volatility are measured over the last 3 years, and everything refreshes every morning. Sharpe is return per unit of volatility. These are ideas to research, not advice.</p>`}
function xDrawer(on){const dr=$('xmDrawer'),b=$('xmHow');if(on){dr.querySelector('.xdb').innerHTML=xHowHTML();dr.style.top=document.querySelector('#xm .xmh').offsetHeight+'px'}dr.classList.toggle('open',!!on);dr.setAttribute('aria-hidden',!on);b.setAttribute('aria-expanded',!!on)}
function dayFmt(k){return MON[+k.slice(5,7)-1]+' '+(+k.slice(8))+', '+k.slice(0,4)}
document.addEventListener('click',e=>{const o=e.target.closest('[data-xopen]');if(o){e.preventDefault();openExplore(o.dataset.xopen,o);return}
  if($('xm').hidden)return;
  if(e.target.closest('[data-xclose]')){closeExplore();return}
  if(e.target.closest('#xmHow')){xDrawer(!$('xmDrawer').classList.contains('open'));return}
  if(e.target.closest('[data-xdclose]')){xDrawer(false);$('xmHow').focus();return}
  const a=e.target.closest('[data-xadd]');if(a&&!a.disabled){xToggleAdd(a.dataset.xadd);return}
  const g=e.target.closest('#xmBody [data-xrng]');if(g){xSetRange(g.dataset.xrng);return}
  const p=e.target.closest('#xmBody .xpt');if(p){const t=p.dataset.xt;xChartTip(t,true);const card=document.querySelector(`#xmBody [data-xc="${CSS.escape(t)}"]`);if(card&&matchMedia('(hover:none)').matches===false)card.scrollIntoView({behavior:'smooth',block:'nearest'});return}});
document.addEventListener('pointerover',e=>{if(!e.target.closest)return;const tr=e.target.closest('tr');const o=e.target.closest('[data-xopen]')||(tr&&tr.querySelector('[data-xopen]'));if(o&&o.dataset.xopen!=='TPS'&&!XDATA[o.dataset.xopen])xLoad(o.dataset.xopen).catch(()=>{})});
document.addEventListener('keydown',e=>{if($('xm').hidden)return;if(e.key==='Escape'){e.stopPropagation();if($('xmDrawer').classList.contains('open')){xDrawer(false);$('xmHow').focus()}else closeExplore()}
  if(e.key==='Tab'){const f=[...$('xm').querySelectorAll('button:not(:disabled),[tabindex="0"]')].filter(x=>x.offsetParent);if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}},true);
document.addEventListener('mouseover',e=>{if($('xm').hidden)return;const p=e.target.closest('#xmBody .xpt');if(p){xChartTip(p.dataset.xt,true);return}
  const lk=e.target.closest('#xmBody .xlegend .li[data-xk]');if(lk){const svg=document.querySelector('#xmBody .xfig svg');if(svg){svg.querySelector('.xdots').classList.add('xfade');svg.querySelectorAll('.xpt').forEach(g=>g.classList.toggle('on',g.dataset.xk===lk.dataset.xk))}return}
  const c=e.target.closest('#xmBody [data-xc]');if(c){const svg=document.querySelector('#xmBody .xfig svg');if(svg){svg.querySelector('.xdots').classList.add('xfade');svg.querySelectorAll('.xpt').forEach(g=>g.classList.toggle('on',g.dataset.xt===c.dataset.xc))}}});
document.addEventListener('mouseout',e=>{if($('xm').hidden)return;const p=e.target.closest('#xmBody .xpt');if(p&&!p.contains(e.relatedTarget)){xChartTip(p.dataset.xt,false);return}
  const lk=e.target.closest('#xmBody .xlegend .li[data-xk]');if(lk&&!lk.contains(e.relatedTarget)){const svg=document.querySelector('#xmBody .xfig svg');if(svg){svg.querySelector('.xdots').classList.remove('xfade');svg.querySelectorAll('.xpt').forEach(g=>g.classList.remove('on'))}return}
  const c=e.target.closest('#xmBody [data-xc]');if(c&&!c.contains(e.relatedTarget)){const svg=document.querySelector('#xmBody .xfig svg');if(svg){svg.querySelector('.xdots').classList.remove('xfade');svg.querySelectorAll('.xpt').forEach(g=>g.classList.remove('on'))}}});
document.addEventListener('focusin',e=>{if($('xm').hidden)return;const p=e.target.closest&&e.target.closest('#xmBody .xpt');if(p)xChartTip(p.dataset.xt,true)});
document.addEventListener('mousemove',e=>{if($('xm').hidden)return;const box=e.target.closest('#xmBody .xspark');document.querySelectorAll('#xmBody .xspark').forEach(b=>{if(b!==box)xSparkOut(b)});if(box)xSparkMove(box,e)});

</script>
